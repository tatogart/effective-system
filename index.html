<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Фенестра 9</title>
<meta name="description" content="Рабочий стол в духе Windows на одной HTML-странице: установщик с ключом, окна, панель задач, приложения и среда восстановления.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='4' fill='%230e8a80'/%3E%3Cpath d='M12 3v18M3 12h18' stroke='%23fff' stroke-width='1.8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* ============ база (повторяет окружение артефакта, чтобы файл работал и сам по себе) ============ */
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}

/* ============ токены ============ */
:root{
  --acc-h:190; --acc-l:50%; --acc-c:.105;
  --acc:oklch(var(--acc-l) var(--acc-c) var(--acc-h));
  --acc-2:oklch(calc(var(--acc-l) - 9%) var(--acc-c) var(--acc-h));
  --acc-fg:oklch(99% .012 var(--acc-h));
  --acc-soft:oklch(var(--acc-l) var(--acc-c) var(--acc-h) / .15);
  --acc-line:oklch(var(--acc-l) var(--acc-c) var(--acc-h) / .45);
  --bg:oklch(93% .012 var(--acc-h));
  --surf:oklch(98.6% .005 var(--acc-h));
  --surf-2:oklch(95.4% .009 var(--acc-h));
  --surf-3:oklch(91% .013 var(--acc-h));
  --txt:oklch(22% .022 var(--acc-h));
  --txt-2:oklch(49% .018 var(--acc-h));
  --line:oklch(86% .013 var(--acc-h));
  --glass:oklch(97.5% .008 var(--acc-h) / .76);
  --glass-line:oklch(100% 0 0 / .6);
  --win-shadow:0 26px 60px -16px oklch(25% .04 var(--acc-h) / .42), 0 3px 10px oklch(25% .04 var(--acc-h) / .15);
  --pop-shadow:0 16px 44px -10px oklch(25% .04 var(--acc-h) / .38);
  --danger:oklch(57% .19 25);
  --ok:oklch(55% .14 150);
  --r:12px; --r-s:8px;
  --f-ui:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --acc-l:76%; --acc-c:.12;
  --acc-fg:oklch(24% .05 var(--acc-h));
  --acc-soft:oklch(var(--acc-l) var(--acc-c) var(--acc-h) / .18);
  --bg:oklch(16.5% .016 var(--acc-h));
  --surf:oklch(21.5% .014 var(--acc-h));
  --surf-2:oklch(25.5% .016 var(--acc-h));
  --surf-3:oklch(31% .018 var(--acc-h));
  --txt:oklch(94% .01 var(--acc-h));
  --txt-2:oklch(71% .016 var(--acc-h));
  --line:oklch(34% .016 var(--acc-h));
  --glass:oklch(20% .014 var(--acc-h) / .78);
  --glass-line:oklch(100% 0 0 / .08);
  --win-shadow:0 30px 70px -18px oklch(3% .02 var(--acc-h) / .8), 0 3px 12px oklch(3% 0 0 / .5);
  --pop-shadow:0 18px 50px -12px oklch(3% .02 var(--acc-h) / .7);
  --danger:oklch(63% .19 25);
  --ok:oklch(72% .15 150);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --acc-l:76%; --acc-c:.12;
  --acc-fg:oklch(24% .05 var(--acc-h));
  --acc-soft:oklch(var(--acc-l) var(--acc-c) var(--acc-h) / .18);
  --bg:oklch(16.5% .016 var(--acc-h));
  --surf:oklch(21.5% .014 var(--acc-h));
  --surf-2:oklch(25.5% .016 var(--acc-h));
  --surf-3:oklch(31% .018 var(--acc-h));
  --txt:oklch(94% .01 var(--acc-h));
  --txt-2:oklch(71% .016 var(--acc-h));
  --line:oklch(34% .016 var(--acc-h));
  --glass:oklch(20% .014 var(--acc-h) / .78);
  --glass-line:oklch(100% 0 0 / .08);
  --win-shadow:0 30px 70px -18px oklch(3% .02 var(--acc-h) / .8), 0 3px 12px oklch(3% 0 0 / .5);
  --pop-shadow:0 18px 50px -12px oklch(3% .02 var(--acc-h) / .7);
  --danger:oklch(63% .19 25);
  --ok:oklch(72% .15 150);
  color-scheme:dark;
}
:root[data-accent="teal"]{--acc-h:190}
:root[data-accent="sky"]{--acc-h:252}
:root[data-accent="violet"]{--acc-h:305}
:root[data-accent="amber"]{--acc-h:70; --acc-c:.12}
:root[data-accent="rose"]{--acc-h:16}

/* ============ каркас ============ */
html,body{height:100%}
body{margin:0;font-family:var(--f-ui);font-size:14px;color:var(--txt);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#os{height:100%;display:flex;flex-direction:column;position:relative;isolation:isolate}
#desk{position:relative;flex:1;min-height:0;overflow:hidden}

#os[data-wall="dusk"] #desk{background:
  radial-gradient(88% 70% at 13% 7%, oklch(59% .13 calc(var(--acc-h) + 12)) 0%, transparent 62%),
  radial-gradient(82% 68% at 89% 90%, oklch(45% .15 calc(var(--acc-h) + 115)) 0%, transparent 66%),
  radial-gradient(58% 48% at 63% 38%, oklch(38% .09 calc(var(--acc-h) + 62)) 0%, transparent 72%),
  linear-gradient(160deg, oklch(26% .07 calc(var(--acc-h) + 28)), oklch(13% .045 calc(var(--acc-h) + 85)))}
#os[data-wall="aurora"] #desk{background:
  radial-gradient(70% 55% at 30% 0%, oklch(74% .14 var(--acc-h) / .85) 0%, transparent 55%),
  radial-gradient(60% 50% at 78% 18%, oklch(62% .15 calc(var(--acc-h) + 70) / .7) 0%, transparent 60%),
  radial-gradient(90% 70% at 50% 110%, oklch(40% .12 calc(var(--acc-h) + 110)) 0%, transparent 70%),
  linear-gradient(180deg, oklch(34% .07 var(--acc-h)), oklch(19% .05 calc(var(--acc-h) + 60)))}
#os[data-wall="grid"] #desk{background:
  repeating-linear-gradient(0deg, oklch(70% .08 var(--acc-h) / .16) 0 1px, transparent 1px 44px),
  repeating-linear-gradient(90deg, oklch(70% .08 var(--acc-h) / .16) 0 1px, transparent 1px 44px),
  radial-gradient(90% 70% at 50% 30%, oklch(34% .06 var(--acc-h)) 0%, oklch(17% .04 var(--acc-h)) 100%)}
#os[data-wall="paper"] #desk{background:
  radial-gradient(80% 60% at 20% 15%, oklch(96% .03 var(--acc-h)) 0%, transparent 60%),
  linear-gradient(150deg, oklch(93% .022 calc(var(--acc-h) + 30)), oklch(87% .04 calc(var(--acc-h) - 25)))}

/* ============ значки рабочего стола ============ */
#icons{position:absolute;inset:10px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,90px);grid-auto-columns:84px;gap:2px;justify-content:start;align-content:start;z-index:1}
.dic{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 3px 5px;border-radius:var(--r-s);border:1px solid transparent;text-align:center;color:oklch(98% 0 0);cursor:default;-webkit-user-select:none;user-select:none}
.dic .ic{filter:drop-shadow(0 1px 3px oklch(15% 0 0 / .5))}
.dic span{font-size:11.5px;line-height:1.25;text-shadow:0 1px 3px oklch(15% 0 0 / .75);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.dic:hover{background:oklch(100% 0 0 / .14);border-color:oklch(100% 0 0 / .18)}
.dic.sel{background:var(--acc-soft);border-color:var(--acc-line)}
#os[data-wall="paper"] .dic{color:oklch(20% .02 var(--acc-h))}
#os[data-wall="paper"] .dic span{text-shadow:0 1px 2px oklch(100% 0 0 / .8)}
#mark{position:absolute;right:16px;bottom:14px;z-index:2;text-align:right;color:oklch(100% 0 0 / .55);text-shadow:0 1px 4px oklch(10% 0 0 / .6);font-size:12.5px;line-height:1.35;cursor:pointer;background:none}
#mark b{display:block;font-size:15px;font-weight:500}
#os[data-wall="paper"] #mark{color:oklch(30% .02 var(--acc-h) / .6);text-shadow:none}

/* ============ окна ============ */
#windows{position:absolute;inset:0;pointer-events:none;z-index:5}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--win-shadow);overflow:hidden;min-width:260px;min-height:150px}
.win.act{border-color:var(--acc-line)}
.win:not(.act){box-shadow:0 10px 26px -14px oklch(25% .04 var(--acc-h) / .4)}
.win:not(.act) .tb{color:var(--txt-2)}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border-width:0}
.tb{flex:0 0 auto;height:38px;display:flex;align-items:center;gap:8px;padding-left:11px;background:var(--surf-2);border-bottom:1px solid var(--line);touch-action:none;-webkit-user-select:none;user-select:none}
.tb-t{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.tb-b{display:flex;align-self:stretch}
.tb-b button{width:44px;display:grid;place-items:center;color:var(--txt-2)}
.tb-b button:hover{background:var(--surf-3);color:var(--txt)}
.tb-b button.cl:hover{background:var(--danger);color:#fff}
.wb{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surf)}
.rs{position:absolute;touch-action:none}
.rs-n{top:-2px;left:10px;right:10px;height:6px;cursor:ns-resize}
.rs-s{bottom:-2px;left:10px;right:10px;height:6px;cursor:ns-resize}
.rs-e{right:-2px;top:10px;bottom:10px;width:6px;cursor:ew-resize}
.rs-w{left:-2px;top:10px;bottom:10px;width:6px;cursor:ew-resize}
.rs-ne{top:-2px;right:-2px;width:14px;height:14px;cursor:nesw-resize}
.rs-nw{top:-2px;left:-2px;width:14px;height:14px;cursor:nwse-resize}
.rs-se{bottom:-2px;right:-2px;width:14px;height:14px;cursor:nwse-resize}
.rs-sw{bottom:-2px;left:-2px;width:14px;height:14px;cursor:nesw-resize}
.win.max .rs{display:none}
#snap{position:absolute;pointer-events:none;border:1.5px solid var(--acc);background:var(--acc-soft);border-radius:var(--r);opacity:0;transition:opacity .12s, left .1s, top .1s, width .1s, height .1s;z-index:4}

/* ============ панель задач ============ */
#bar{flex:0 0 auto;height:52px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:0 12px;background:var(--glass);backdrop-filter:blur(24px) saturate(165%);border-top:1px solid var(--glass-line);z-index:60}
.bar-l{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-2)}
.bar-c{display:flex;align-items:center;gap:5px;justify-content:center}
.bar-r{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.tbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--txt)}
.tbtn:hover{background:var(--surf-3)}
.tbtn.on{background:var(--acc-soft)}
#tasks{display:flex;align-items:center;gap:4px;max-width:46vw;overflow-x:auto}
.task{width:40px;height:40px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;position:relative;color:var(--txt)}
.task:hover{background:var(--surf-3)}
.task::after{content:"";position:absolute;bottom:3px;left:50%;translate:-50% 0;width:5px;height:3px;border-radius:2px;background:var(--txt-2);transition:width .15s}
.task.act{background:var(--acc-soft)}
.task.act::after{width:16px;background:var(--acc)}
.tray{display:flex;align-items:center;gap:2px;padding:0 4px}
.tray button{width:32px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--txt-2)}
.tray button:hover{background:var(--surf-3);color:var(--txt)}
#clock{padding:4px 10px;border-radius:8px;text-align:right;line-height:1.2;font-size:12px;font-variant-numeric:tabular-nums}
#clock:hover{background:var(--surf-3)}
#clock b{display:block;font-weight:500}
#clock i{font-style:normal;color:var(--txt-2);font-size:11px}

/* ============ меню и поповеры ============ */
.pop{position:absolute;z-index:300;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-line);border-radius:14px;box-shadow:var(--pop-shadow);padding:12px}
.menu{position:absolute;z-index:320;min-width:206px;background:var(--surf);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop-shadow);padding:5px;font-size:13px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:7px;text-align:left}
.menu button:hover{background:var(--surf-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 6px}
.menu .k{margin-left:auto;color:var(--txt-2);font-size:11px}
#smenu{position:absolute;left:50%;translate:-50% 0;bottom:60px;z-index:300;width:min(560px,calc(100vw - 20px));max-height:calc(100vh - 130px);overflow:auto;background:var(--glass);backdrop-filter:blur(30px) saturate(170%);border:1px solid var(--glass-line);border-radius:16px;box-shadow:var(--pop-shadow);padding:16px;display:flex;flex-direction:column;gap:14px}
.srch{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.srch input{flex:1;border:0;background:none;padding:10px 0;outline:none;min-width:0}
.sec-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt-2);margin-bottom:8px}
#pinned{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.pin{display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 4px;border-radius:10px;font-size:11.5px;text-align:center;line-height:1.2}
.pin:hover{background:var(--surf-3)}
#recent{display:flex;flex-direction:column;gap:2px}
.rec{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:13px;width:100%;text-align:left}
.rec:hover{background:var(--surf-3)}
.rec small{margin-left:auto;color:var(--txt-2);font-size:11px}
.sfoot{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.user{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;padding:6px 10px 6px 6px;border-radius:9px}
.user:hover{background:var(--surf-3)}
.ava{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--acc-fg);display:grid;place-items:center;font-size:12px;font-weight:700}
</style>
<style>
/* ============ общие элементы приложений ============ */
.row{display:flex;align-items:center;gap:8px}
.tool{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 9px;background:var(--surf-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.btn{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surf);font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--surf-3)}
.btn.pri{background:var(--acc);color:var(--acc-fg);border-color:transparent;font-weight:500}
.btn.pri:hover{background:var(--acc-2)}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.fld{padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surf);min-width:0}
.stat{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:5px 11px;border-top:1px solid var(--line);background:var(--surf-2);font-size:11.5px;color:var(--txt-2);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stat span{white-space:nowrap}
.sep{width:1px;height:22px;background:var(--line)}
.empty{grid-column:1/-1;padding:28px 10px;text-align:center;color:var(--txt-2);font-size:12.5px}

/* проводник */
.ex{flex:1;min-height:0;display:grid;grid-template-columns:172px 1fr}
.ex-s{border-right:1px solid var(--line);background:var(--surf-2);padding:8px 6px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ex-s .sec-h{padding:8px 8px 4px;margin:0}
.ex-s button{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;font-size:12.5px;text-align:left;width:100%}
.ex-s button:hover{background:var(--surf-3)}
.ex-s button.on{background:var(--acc-soft);color:var(--acc-2);font-weight:500}
.ex-m{min-width:0;display:flex;flex-direction:column}
.crumbs{flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:7px 9px;border-bottom:1px solid var(--line);font-size:12px;overflow-x:auto;white-space:nowrap}
.crumbs button{padding:4px 7px;border-radius:6px}
.crumbs button:hover{background:var(--surf-2)}
.crumbs em{color:var(--txt-2);font-style:normal}
.files{flex:1;min-height:0;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px;align-content:start}
.fitem{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 5px;border-radius:9px;border:1px solid transparent;font-size:11.5px;text-align:center;line-height:1.25;word-break:break-word;-webkit-user-select:none;user-select:none}
.fitem:hover{background:var(--surf-2)}
.fitem.sel{background:var(--acc-soft);border-color:var(--acc-line)}

/* блокнот */
.np{flex:1;min-height:0;display:flex;flex-direction:column}
.np textarea{flex:1;min-height:0;width:100%;resize:none;border:0;outline:none;background:var(--surf);padding:14px 16px;font-family:var(--f-mono);font-size:13px;line-height:1.65;color:var(--txt)}

/* терминал */
.tm{flex:1;min-height:0;display:flex;flex-direction:column;background:oklch(16% .018 var(--acc-h));cursor:text;position:relative}
.tm-log{flex:1;min-height:0;overflow:auto;margin:0;padding:12px 14px 2px;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;color:oklch(90% .02 var(--acc-h));white-space:pre-wrap;word-break:break-word}
.tm-log .p{color:oklch(78% .13 var(--acc-h))}
.tm-log .e{color:oklch(70% .17 25)}
.tm-log .d{color:oklch(62% .02 var(--acc-h))}
.tm-log .g{color:oklch(75% .16 150)}
.tm-r{display:flex;align-items:center;gap:8px;padding:2px 14px 12px;font-family:var(--f-mono);font-size:12.5px}
.tm-r span{color:oklch(78% .13 var(--acc-h));white-space:nowrap}
.tm-r input{flex:1;min-width:0;border:0;background:none;outline:none;color:oklch(94% .01 var(--acc-h));font:inherit;caret-color:oklch(78% .13 var(--acc-h))}

/* калькулятор */
.cl{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;padding:12px}
.cl-d{background:var(--surf-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:right}
.cl-d i{display:block;font-style:normal;font-size:11.5px;color:var(--txt-2);height:15px;font-family:var(--f-mono)}
.cl-d b{display:block;font-size:30px;font-weight:500;font-family:var(--f-mono);overflow-x:auto;white-space:nowrap}
.cl-k{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:6px}
.cl-k button{border-radius:9px;background:var(--surf-2);border:1px solid var(--line);font-size:16px;font-family:var(--f-mono);min-height:42px}
.cl-k button:hover{background:var(--surf-3)}
.cl-k button.op{color:var(--acc-2);font-weight:700}
.cl-k button.eq{background:var(--acc);color:var(--acc-fg);border-color:transparent;font-weight:700}
.cl-k button.fn{font-size:13px;color:var(--txt-2)}

/* кисть */
.pt{flex:1;min-height:0;display:flex;flex-direction:column}
.pt-c{flex:1;min-height:0;overflow:auto;padding:12px;display:grid;place-items:center;background:var(--surf-3)}

.sol-r{display:flex;gap:9px;margin-bottom:16px}
.sol-t{display:flex;gap:9px;align-items:flex-start}
.pile{width:64px;flex:0 0 auto;position:relative;min-height:90px}
.slot{width:64px;height:90px;border-radius:8px;border:1.5px dashed oklch(100% 0 0 / .3);display:grid;place-items:center;color:oklch(100% 0 0 / .35)}
.pcard{position:absolute;left:0;width:64px;height:90px;border-radius:8px;background:#fdfbf7;border:1px solid oklch(20% 0 0 / .25);
  box-shadow:0 2px 6px oklch(20% 0 0 / .28);padding:5px 6px;font-family:var(--f-ui);font-weight:700;font-size:14px;line-height:1.05;text-align:left;cursor:pointer}
.pcard .sm{font-size:17px;display:block;margin-top:1px}
.pcard .big{position:absolute;right:6px;bottom:4px;font-size:23px;opacity:.9}
.pcard.red{color:oklch(50% .19 25)}
.pcard.black{color:oklch(26% .02 240)}
.pcard.back{background:repeating-linear-gradient(45deg, oklch(45% .1 var(--acc-h)) 0 6px, oklch(38% .09 var(--acc-h)) 6px 12px);border-color:oklch(30% .05 var(--acc-h))}
.pcard.sel{outline:2.5px solid oklch(85% .17 90);outline-offset:1px;translate:0 -7px}
.sol-b{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sol-b .btn{background:oklch(100% 0 0 / .12);border-color:oklch(100% 0 0 / .2);color:#fff}
.sol-b .btn:hover{background:oklch(100% 0 0 / .22)}
.sol-i{color:oklch(97% 0 0);font-size:12.5px;display:flex;gap:14px;font-variant-numeric:tabular-nums}

/* ============ браузер ============ */
.br{flex:1;min-height:0;display:flex;flex-direction:column}
.br-c{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:8px;background:var(--surf-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.br-u{flex:1;min-width:150px;display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:99px;padding:6px 13px}
.br-u input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:12.5px;font-family:var(--f-mono)}
.br-b{flex:0 0 auto;display:flex;gap:4px;padding:6px 8px;background:var(--surf-2);border-bottom:1px solid var(--line);overflow-x:auto}
.br-b button{font-size:11.5px;padding:4px 10px;border-radius:7px;white-space:nowrap;color:var(--txt-2);display:flex;align-items:center;gap:6px}
.br-b button:hover{background:var(--surf-3);color:var(--txt)}
.br iframe{flex:1;min-height:0;border:0;background:#fff;width:100%}

/* ============ часы ============ */
.ck{flex:1;min-height:0;display:flex;flex-direction:column}
.ck-t{flex:0 0 auto;display:flex;gap:3px;padding:8px;background:var(--surf-2);border-bottom:1px solid var(--line)}
.ck-t button{padding:7px 13px;border-radius:8px;font-size:12.5px}
.ck-t button.on{background:var(--acc);color:var(--acc-fg);font-weight:500}
.ck-b{flex:1;min-height:0;overflow:auto;padding:18px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ck-big{font-size:clamp(34px,9vw,54px);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.ck-sub{color:var(--txt-2);font-size:12.5px}
.ck-w{width:100%;max-width:330px;display:flex;flex-direction:column;gap:6px}
.ck-wr{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:7px 11px;border-radius:9px;background:var(--surf-2);border:1px solid var(--line)}
.ck-wr b{margin-left:auto;font-variant-numeric:tabular-nums}
.ring{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--acc) calc(var(--p,0) * 1%), var(--surf-3) 0);position:relative}
.ring::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--surf)}
.ring b{position:relative;z-index:1;font-size:27px;font-weight:700;font-variant-numeric:tabular-nums}
.laps{width:100%;max-width:330px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-variant-numeric:tabular-nums}
.laps div{display:flex;justify-content:space-between;padding:5px 9px;border-radius:7px;background:var(--surf-2)}

/* ============ центр обновления ============ */
.upd{flex:1;min-height:0;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.upd-h{display:flex;gap:14px;align-items:flex-start}
.upd-h .ci{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);flex:0 0 auto}
.upd-h h2{margin:0 0 3px;font-size:18px}
.upd-h p{margin:0;font-size:12.5px;color:var(--txt-2)}
.upd-log{font-family:var(--f-mono);font-size:11.5px;line-height:1.7;color:var(--txt-2);max-height:140px;overflow:auto;white-space:pre-wrap}

/* ============ диспетчер: графики ============ */
.graphs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:11px;background:var(--surf-2);border-bottom:1px solid var(--line)}
.graph{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:9px 10px 6px;position:relative}
.graph .gh{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.graph .gh span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--txt-2)}
.graph .gh b{font-size:15px;font-variant-numeric:tabular-nums;margin-left:auto}
.graph canvas{width:100%;height:62px;display:block}
.graph .gt{position:absolute;pointer-events:none;background:var(--surf);border:1px solid var(--line);border-radius:7px;
  padding:3px 7px;font-size:11px;box-shadow:var(--pop-shadow);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ============ проводник: список ============ */
.files.list{display:flex;flex-direction:column;gap:1px;padding:6px}
.files.list .fitem{flex-direction:row;align-items:center;gap:10px;padding:7px 10px;text-align:left;width:100%}
.files.list .fitem span:last-child{-webkit-line-clamp:1;text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem input{width:100%;font:inherit;font-size:11.5px;text-align:center;border:1px solid var(--acc);border-radius:5px;background:var(--surf);padding:2px 3px;outline:none}
.files.list .fitem input{text-align:left}

/* ============ кисть: инструменты ============ */
.tool-b{width:32px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;color:var(--txt-2)}
.tool-b:hover{background:var(--surf-3)}
.tool-b.on{background:var(--acc);border-color:transparent;color:var(--acc-fg)}
@media (max-width:760px){
  .tv-d{width:100%;max-width:300px}
  .note{width:170px}
}

function node(path){ let n=fs; for(const p of path){ if(!n||n.t!=='d'||!n.c[p]) return null; n=n.c[p]; } return n; }
function uniqueName(dir,name){
  if(!dir.c[name]) return name;
  const dot=name.lastIndexOf('.'), base=dot>0?name.slice(0,dot):name, ext=dot>0?name.slice(dot):'';
  let i=2; while(dir.c[base+' ('+i+')'+ext]) i++;
  return base+' ('+i+')'+ext;
}
const fsWatchers=new Set();

function toBin(path){
  const dir=node(path.slice(0,-1)), nm=path[path.length-1];

/* ---------------- ключ продукта ---------------- */
const ALPHA='BCDFGHJKMPQRTVWXY2346789';
function keySum(s){ let t=0; for(const ch of s) t+=ALPHA.indexOf(ch)+1; return t; }
function genKey(){
  let s=''; for(let i=0;i<19;i++) s+=ALPHA[Math.floor(Math.random()*ALPHA.length)];
  const need=(24-(keySum(s)%24))%24;
  s+=ALPHA[need===0?ALPHA.length-1:need-1];
  if(keySum(s)%24!==0) return genKey();
  return 'FNSTR-'+s.match(/.{5}/g).join('-');
}
function normKey(k){ return String(k||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function validKey(k){
  const n=normKey(k);
  if(!n.startsWith('FNSTR')) return false;
  const body=n.slice(5);
  if(body.length!==20) return false;
  for(const ch of body) if(!ALPHA.includes(ch)) return false;
  return keySum(body)%24===0;
}
function fmtKey(k){
  const n=normKey(k); if(!n.startsWith('FNSTR')) return k;
  const b=n.slice(5,25); return 'FNSTR'+(b?'-'+(b.match(/.{1,5}/g)||[]).join('-'):'');
}

let ac=null;
function actx(){ try{ ac=ac||new (W.AudioContext||W.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }catch(e){ return null; } }
function blip(f,dur,g,type){
  if(!state.vol) return;
  const c=actx(); if(!c) return;
  try{
    const o=c.createOscillator(), n=c.createGain(), t=c.currentTime;
    o.type=type||'sine'; o.frequency.value=f||480;
    o.connect(n); n.connect(c.destination);
    n.gain.setValueAtTime(0,t);
    n.gain.linearRampToValueAtTime((g||.2)*state.vol,t+.012);
    n.gain.exponentialRampToValueAtTime(.0001,t+(dur||.07));
    o.start(t); o.stop(t+(dur||.07)+.03);
  }catch(e){}
}
function jingle(){
  if(!state.vol) return;
  [[523,0],[659,120],[784,240],[1047,380]].forEach(([f,d])=>setTimeout(()=>blip(f,.3,.16,'triangle'),d));
}

function startDrag(w,e){

    const rw=(w.prev&&w.prev.w)||Math.min(660,d.w-40), rh=(w.prev&&w.prev.h)||Math.min(460,d.h-40);
    w.max=false; w.node.classList.remove('max'); w.maxBtn.innerHTML=ico('max',16);
    w.rect={w:rw,h:rh,x:clamp(e.clientX-dr.left-rw/2,0,d.w-rw),y:clamp(e.clientY-dr.top-19,0,d.h-rh)};

    w.rect.y=clamp(r0.y+dy,0,d.h-38);

function startResize(w,e,dir){

    const dx=ev.clientX-sx, dy=ev.clientY-sy;

    if(dir.includes('s')) w.rect.h=clamp(r0.h+dy,mn.h,d.h-r0.y);
    if(dir.includes('w')){ const nw=clamp(r0.w-dx,mn.w,r0.x+r0.w); w.rect.x=r0.x+r0.w-nw; w.rect.w=nw; }

const PINNED=['explorer','browser','notepad','term','calc','paint','photos','solitaire','mines','snake','player','clock','tasksmgr','update','bin','settings'];
function collectFiles(path,acc,limit){
  const n=node(path); if(!n||n.t!=='d') return acc;
  for(const nm of Object.keys(n.c)){
    const ch=n.c[nm];
    if(ch.t==='f') acc.push({name:nm,path:path.concat(nm)});
    else if(acc.length<limit) collectFiles(path.concat(nm),acc,limit);
    if(acc.length>=limit) break;
  }
  return acc;
}

function cmpNames(a,b,dir){

    let names=Object.keys(dir.c).sort((a,b)=>cmpNames(a,b,dir));
    if(!asc){ const d1=names.filter(n=>dir.c[n].t==='d').reverse(),f1=names.filter(n=>dir.c[n].t!=='d').reverse(); names=d1.concat(f1); }
    if(!names.length) files.append(h('div',{class:'empty'},'Здесь пока пусто'));
    names.forEach(nm=>{

          if(e.key==='Escape'){ renaming=null; render(); } });
        label.addEventListener('blur',()=>commitRename(nm,label.value));

      el.addEventListener('pointerdown',()=>{ if(renaming) return; sel=nm;
        files.querySelectorAll('.fitem.sel').forEach(x=>x.classList.remove('sel')); el.classList.add('sel');

        {label:'Переименовать',icon:'rename',key:'F2',on:()=>{ renaming=nm; render(); }},
        {label:'Копировать',icon:'save',key:'Ctrl+C',on:()=>{ clip={name:nm,node:JSON.parse(JSON.stringify(it))}; render(); toast('Скопировано: '+nm); }},'-',
        {label:'Удалить',icon:'trash',key:'Del',on:()=>{ toBin(path.concat(nm)); sel=null; render(); }}

  }

/* ---------------- терминал ---------------- */
function mountTerm(win){
  let cwd=[];
  const log=h('pre',{class:'tm-log'}),pr=h('span'),inp=h('input',{spellcheck:'false',autocomplete:'off',autocapitalize:'off','aria-label':'Командная строка'});
  win.body.append(h('div',{class:'tm'},log,h('div',{class:'tm-r'},pr,inp)));
  win.body.addEventListener('click',e=>{ if(!e.target.closest('input')) inp.focus(); });
  const hist=[]; let hp=-1;
  const out=(t,c)=>{ log.append(h('span',{class:c||''},t+'\n')); log.scrollTop=log.scrollHeight; };
  const pstr=()=>'guest@fenestra:'+(cwd.length?'~/'+cwd.join('/'):'~')+'$';
  const setPr=()=>{ pr.textContent=pstr(); };
  function resolve(a){
    if(!a) return cwd.slice();
    let p=(a[0]==='~'||a[0]==='/')?[]:cwd.slice();
    a.replace(/^[~/]+/,'').split('/').forEach(s=>{ if(!s||s==='.') return; if(s==='..') p.pop(); else p.push(s); });
    return p;
  }
  const HELP=[['ls [путь]','список файлов'],['cd путь','сменить папку'],['pwd','текущая папка'],
    ['cat файл','показать текст'],['open цель','открыть файл или приложение'],['mkdir имя','создать папку'],
    ['touch имя','создать файл'],['rm имя','отправить в корзину'],['echo текст','напечатать'],
    ['theme тема','light, dark, system'],['accent цвет','teal, sky, violet, amber, rose'],
    ['date','дата и время'],['whoami','кто я'],['apps','список приложений'],['key','ключ продукта'],
    ['neofetch','о системе'],['note текст','стикер на рабочий стол'],['vd [номер]','рабочие столы'],
    ['matrix','кое-что зелёное'],['party','конфетти'],
    ['crash','синий экран (не надо)'],['recovery','среда восстановления'],['clear','очистить экран']];
  function run(line){
    const parts=line.trim().split(/\s+/),cmd=parts[0],a=parts.slice(1),rest=line.trim().slice(cmd.length).trim();
    if(!cmd) return;
    switch(cmd){
      case 'help': HELP.forEach(([c,d])=>out('  '+c.padEnd(16)+d,'d')); break;
      case 'ls':{
        const p=resolve(a[0]),n=node(p);
        if(!n){ out('ls: «'+a[0]+'»: нет такого пути','e'); break; }
        if(n.t==='f'){ out(p[p.length-1]); break; }
        const names=Object.keys(n.c).sort((x,y)=>cmpNames(x,y,n));

      case 'pwd': out(cwd.length?'~/'+cwd.join('/'):'~'); break;
      case 'cat':{

        const n=node(resolve(a[0]));

      }
      case 'mkdir':{ if(!a[0]){ out('mkdir: укажите имя','e'); break; } const d=node(cwd),nm=uniqueName(d,a.join(' ')); d.c[nm]={t:'d',c:{}}; fsChanged(); out('создана папка '+nm,'g'); break; }
      case 'touch':{ if(!a[0]){ out('touch: укажите имя','e'); break; } const d=node(cwd),nm=a.join(' '); if(!d.c[nm]) d.c[nm]={t:'f',body:''}; fsChanged(); out('создан файл '+nm,'g'); break; }
      case 'rm':{ if(!a[0]){ out('rm: укажите имя','e'); break; } const d=node(cwd),nm=a.join(' '); if(!d.c[nm]){ out('rm: «'+nm+'»: нет такого файла','e'); break; } toBin(cwd.concat(nm)); out('в корзину: '+nm,'g'); break; }
      case 'echo': out(rest); break;
      case 'theme':{ if(['light','dark','system'].includes(a[0])){ setTheme(a[0]); out('тема: '+a[0],'g'); } else out('theme: light, dark или system','e'); break; }
      case 'accent':{ if(['teal','sky','violet','amber','rose'].includes(a[0])){ state.accent=a[0]; applyChrome(); save(); settingsRefresh(); out('акцент: '+a[0],'g'); } else out('accent: teal, sky, violet, amber, rose','e'); break; }
      case 'date': out(new Date().toLocaleString('ru-RU',{dateStyle:'full',timeStyle:'medium'})); break;
      case 'whoami': out(state.user.toLowerCase()); break;
      case 'apps': Object.keys(APPS).forEach(k=>out('  '+k.padEnd(11)+APPS[k].title,'d')); break;
      case 'key': out(state.key||'(ключ не введён)',state.activated?'g':'e'); out(state.activated?'состояние: активировано':'состояние: не активировано','d'); break;
      case 'clear': log.innerHTML=''; break;
      case 'sudo': out('guest не входит в список sudoers. Инцидент записан. Шутка.','e'); break;
      case 'note':{
        addNote(80+((state.notes.length*30)%220),80+((state.notes.length*26)%180));
        if(rest){ state.notes[state.notes.length-1].text=rest; save(); renderNotes(); }
        out('стикер создан','g'); break;
      }
      case 'vd':{
        if(a[0]){ const i=parseInt(a[0],10)-1; if(vds[i]){ switchVD(i); out('переключено на '+vds[i],'g'); } else out('vd: нет стола №'+a[0],'e'); }
        else vds.forEach((nm,i)=>out('  '+(i===curVD?'* ':'  ')+(i+1)+'. '+nm,i===curVD?'g':'d'));
        break;
      }
      case 'matrix': out('вход в матрицу…','g'); matrixRain(); break;
      case 'party': out('да начнётся веселье','g'); confetti(); break;
      case 'crash': out('вызываю исключение ядра…','e'); setTimeout(()=>bsod('FENESTRA_MANUALLY_INITIATED_CRASH'),450); break;
      case 'recovery': out('перезагрузка в среду восстановления…','g'); setTimeout(()=>openRecovery(),400); break;
      case 'neofetch':{
        const art=['  ┌─────┬─────┐','  │     │     │','  ├─────┼─────┤','  │     │     │','  └─────┴─────┘'];
        const info=[state.user.toLowerCase()+'@fenestra','──────────────','ОС: Фенестра '+state.ver+' (сборка '+BUILD[state.ver]+')','Ядро: HTML 5 / CSS / JS',
          'Оболочка: fsh 1.1','Окон открыто: '+wins.size,'Тема: '+state.theme+', акцент: '+state.accent,
          'Активация: '+(state.activated?'да':'нет'),'Разрешение: '+W.innerWidth+'×'+W.innerHeight];
        for(let i=0;i<Math.max(art.length,info.length);i++) out((art[i]||'               ').padEnd(17)+(info[i]||''),i<2?'p':'');
        break;
      }

    }
  }
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){

    } else if(e.key==='ArrowUp'){ e.preventDefault(); if(hp>0){ hp--; inp.value=hist[hp]; } }
    else if(e.key==='ArrowDown'){ e.preventDefault(); if(hp<hist.length-1){ hp++; inp.value=hist[hp]; } else { hp=hist.length; inp.value=''; } }
    else if(e.key==='l'&&e.ctrlKey){ e.preventDefault(); log.innerHTML=''; }
  });
  out('Фенестра, командная оболочка fsh 1.1','p');
  out('Наберите help, чтобы увидеть список команд.','d');
  out('');
  setPr();
  setTimeout(()=>{ if(!('ontouchstart' in W)) inp.focus(); },40);
}

/* ---------------- калькулятор ---------------- */
function mountCalc(win){
  let cur='0',prev=null,op=null,fresh=false;
  const line=h('i',{}),val=h('b',{},'0'),keys=h('div',{class:'cl-k'});
  win.body.append(h('div',{class:'cl'},h('div',{class:'cl-d'},line,val),keys));
  const fmt=x=>{ if(!isFinite(x)) return 'ошибка'; const r=Math.round(x*1e10)/1e10; return String(r).length>14?r.toExponential(6):String(r); };
  const draw=()=>{ val.textContent=cur; line.textContent=prev!==null?fmt(prev)+' '+op:''; };
  function calc(){
    const b=parseFloat(cur.replace(',','.')),a=prev;
    if(op==='+') return a+b; if(op==='−') return a-b; if(op==='×') return a*b;
    if(op==='÷') return b===0?NaN:a/b; if(op==='%') return a*b/100;
    return b;
  }
  function press(k){
    if(/^[0-9]$/.test(k)){ cur=(cur==='0'||fresh)?k:cur+k; fresh=false; }
    else if(k==='.'){ if(fresh){ cur='0'; fresh=false; } if(!cur.includes('.')) cur+='.'; }
    else if(['+','−','×','÷','%'].includes(k)){
      if(prev!==null&&!fresh){ prev=calc(); cur=fmt(prev); } else prev=parseFloat(cur.replace(',','.'));
      op=k; fresh=true;
    }
    else if(k==='='){ if(prev!==null){ cur=fmt(calc()); prev=null; op=null; fresh=true; } }
    else if(k==='C'){ cur='0'; prev=null; op=null; fresh=false; }
    else if(k==='⌫'){ cur=cur.length>1?cur.slice(0,-1):'0'; }
    else if(k==='±'){ cur=cur.startsWith('-')?cur.slice(1):'-'+cur; }
    else if(k==='1/x'){ const v=parseFloat(cur); cur=v?fmt(1/v):'ошибка'; fresh=true; }
    else if(k==='√'){ const v=parseFloat(cur); cur=v<0?'ошибка':fmt(Math.sqrt(v)); fresh=true; }
    draw(); blip(620,.035,.1);
  }
  [['C','fn'],['⌫','fn'],['1/x','fn'],['√','fn'],['7',''],['8',''],['9',''],['÷','op'],
   ['4',''],['5',''],['6',''],['×','op'],['1',''],['2',''],['3',''],['−','op'],
   ['±',''],['0',''],['.',''],['+','op'],['%','op'],['=','eq']].forEach(([k,c])=>{
    const b=h('button',{class:c},k);
    if(k==='=') b.style.gridColumn='span 3';
    b.onclick=()=>press(k); keys.append(b);
  });
  win.node.addEventListener('keydown',e=>{
    const m={'Enter':'=','Backspace':'⌫','Escape':'C','*':'×','/':'÷','-':'−','+':'+','%':'%',',':'.','.':'.','=':'='};
    if(/^[0-9]$/.test(e.key)){ press(e.key); e.preventDefault(); }
    else if(m[e.key]){ press(m[e.key]); e.preventDefault(); }
  });
  draw();
}

/* ---------------- кисть ---------------- */
function mountPaint(win){
  const CW=640,CH=400;
  const cv=h('canvas',{width:CW,height:CH}),g=cv.getContext('2d',{willReadFrequently:true});
  g.fillStyle='#fff'; g.fillRect(0,0,CW,CH); g.lineJoin=g.lineCap='round';
  let color='#1d3f4a',size=4,tool='brush',drawing=false,lx=0,ly=0,snap=null;
  const undo=[];
  const COLORS=['#1d3f4a','#0e8a80','#2f6fd0','#7a4bd0','#c8371f','#d98b12','#2c8a3f','#ffffff'];
  const TOOLS=[['brush','brush','Кисть'],['lineic','line','Линия'],['rectic','rect','Прямоугольник'],
    ['ellipseic','ellipse','Эллипс'],['fill','fill','Заливка'],['picker','picker','Пипетка'],['eraser','eraser','Ластик']];
  const tbtns=TOOLS.map(([icn,id,title])=>{
    const b=h('button',{class:'tool-b'+(id===tool?' on':''),title:title,html:ico(icn,17)});
    b.onclick=()=>{ tool=id; sync(); };
    return b;
  });
  const sw=COLORS.map(c=>{
    const b=h('button',{class:'sw',style:'background:'+c,title:c,'aria-label':'Цвет '+c});
    b.onclick=()=>{ color=c; if(tool==='eraser'||tool==='picker') tool='brush'; sync(); };
    return b;
  });
  const pick=h('input',{type:'color',value:'#1d3f4a',class:'sw',style:'padding:0;width:26px;height:24px',title:'Свой цвет'});
  pick.oninput=()=>{ color=pick.value; if(tool==='eraser') tool='brush'; sync(); };
  const bUndo=h('button',{class:'btn',title:'Отменить (Ctrl+Z)',html:ico('undo',15)});
  const bClear=h('button',{class:'btn',html:ico('trash',15)});
  const bSave=h('button',{class:'btn pri',html:ico('save',15)+'<span>Сохранить</span>'});
  const range=h('input',{type:'range',class:'slider',min:'1',max:'30',value:String(size),style:'width:84px','aria-label':'Толщина'});
  const lab=h('span',{style:'font-size:11.5px;color:var(--txt-2);min-width:40px'},size+' px');
  const stat=h('div',{class:'stat'});
  win.body.append(h('div',{class:'tool'},tbtns,h('div',{class:'sep'}),range,lab,h('div',{class:'sep'}),sw,pick,h('div',{class:'sep'}),bUndo,bClear,bSave),
    h('div',{class:'pt'},h('div',{class:'pt-c'},cv)),stat);
  function sync(){
    tbtns.forEach((b,i)=>b.classList.toggle('on',TOOLS[i][1]===tool));
    sw.forEach((b,i)=>b.classList.toggle('on',COLORS[i]===color));
    pick.value=/^#[0-9a-f]{6}$/i.test(color)?color:pick.value;
    bUndo.disabled=!undo.length;
    stat.innerHTML='';
    stat.append(h('span',{},'Инструмент: '+(TOOLS.find(t=>t[1]===tool)||[,,''])[2]),
      h('span',{},'цвет: '+color),h('span',{},'толщина: '+size+' px'),h('span',{},'шагов отмены: '+undo.length));
  }
  function push(){ try{ undo.push(cv.toDataURL('image/png')); if(undo.length>12) undo.shift(); }catch(e){} sync(); }
  function restore(url,then){ const im=new Image(); im.onload=()=>{ g.clearRect(0,0,CW,CH); g.drawImage(im,0,0); then&&then(); }; im.src=url; }
  range.oninput=()=>{ size=+range.value; lab.textContent=size+' px'; sync(); };
  bUndo.onclick=()=>{ const u=undo.pop(); if(u) restore(u,sync); };
  bClear.onclick=()=>{ push(); g.fillStyle='#fff'; g.fillRect(0,0,CW,CH); };
  bSave.onclick=()=>{
    try{
      const dir=node(['Изображения']),nm=uniqueName(dir,'рисунок.png');
      dir.c[nm]={t:'f',data:cv.toDataURL('image/png')};
      fsChanged(); toast('Сохранено в Изображения: '+nm);
      openWin('photos',{path:['Изображения',nm]});
    }catch(e){ toast('Не удалось сохранить рисунок'); }
  };
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*CW/r.width,(e.clientY-r.top)*CH/r.height]; };
  const hex=(r,gg,b)=>'#'+[r,gg,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  function flood(x,y,to){
    x|=0; y|=0;
    const img=g.getImageData(0,0,CW,CH),d=img.data;
    const at=(px,py)=>(py*CW+px)*4;
    const s0=at(x,y),t0=[d[s0],d[s0+1],d[s0+2],d[s0+3]];
    const m=/^#?([0-9a-f]{6})$/i.exec(to); if(!m) return;
    const tc=[parseInt(m[1].slice(0,2),16),parseInt(m[1].slice(2,4),16),parseInt(m[1].slice(4,6),16),255];
    if(t0.every((v,i)=>v===tc[i])) return;
    const near=i=>Math.abs(d[i]-t0[0])+Math.abs(d[i+1]-t0[1])+Math.abs(d[i+2]-t0[2])+Math.abs(d[i+3]-t0[3])<40;
    const st=[[x,y]];
    while(st.length){
      const [px,py]=st.pop();
      if(px<0||py<0||px>=CW||py>=CH) continue;
      const i=at(px,py);
      if(!near(i)) continue;
      d[i]=tc[0]; d[i+1]=tc[1]; d[i+2]=tc[2]; d[i+3]=255;
      st.push([px+1,py],[px-1,py],[px,py+1],[px,py-1]);
    }
    g.putImageData(img,0,0);
  }
  function shape(x0,y0,x1,y1){
    g.strokeStyle=color; g.lineWidth=size; g.fillStyle=color;
    if(tool==='line'){ g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke(); }
    else if(tool==='rect'){ g.strokeRect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(x1-x0),Math.abs(y1-y0)); }
    else if(tool==='ellipse'){
      g.beginPath();
      g.ellipse((x0+x1)/2,(y0+y1)/2,Math.abs(x1-x0)/2,Math.abs(y1-y0)/2,0,0,Math.PI*2);
      g.stroke();
    }
  }
  cv.addEventListener('pointerdown',e=>{
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    const [x,y]=pos(e);
    if(tool==='picker'){
      const d=g.getImageData(x|0,y|0,1,1).data;
      color=hex(d[0],d[1],d[2]); tool='brush'; sync(); toast('Цвет: '+color); return;
    }
    push();
    if(tool==='fill'){ flood(x,y,color); return; }
    drawing=true; lx=x; ly=y;
    if(tool==='brush'||tool==='eraser'){
      g.strokeStyle=g.fillStyle=tool==='eraser'?'#fff':color;
      g.lineWidth=tool==='eraser'?size*2.4:size;
      g.beginPath(); g.arc(x,y,g.lineWidth/2,0,Math.PI*2); g.fill();
    } else snap=cv.toDataURL('image/png');
  });
  cv.addEventListener('pointermove',e=>{
    if(!drawing) return;
    const [x,y]=pos(e);
    if(tool==='brush'||tool==='eraser'){
      g.strokeStyle=tool==='eraser'?'#fff':color;
      g.lineWidth=tool==='eraser'?size*2.4:size;
      g.beginPath(); g.moveTo(lx,ly); g.lineTo(x,y); g.stroke();
      lx=x; ly=y;
    } else if(snap){
      const im=new Image();
      im.onload=()=>{ g.clearRect(0,0,CW,CH); g.drawImage(im,0,0); shape(lx,ly,x,y); };
      im.src=snap;
      cv.dataset.x=x; cv.dataset.y=y;
    }
  });
  const stop=e=>{
    if(!drawing) return;
    drawing=false;
    if(snap&&(tool==='line'||tool==='rect'||tool==='ellipse')){
      const x=+cv.dataset.x||lx,y=+cv.dataset.y||ly;
      const im=new Image();
      im.onload=()=>{ g.clearRect(0,0,CW,CH); g.drawImage(im,0,0); shape(lx,ly,x,y); };
      im.src=snap;
    }
    snap=null;
  };
  cv.addEventListener('pointerup',stop); cv.addEventListener('pointercancel',stop);
  win.node.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); bUndo.onclick(); } });
  sync();
}

/* ---------------- сапёр ---------------- */
function mountMines(win){
  const N=9,TOTAL=10;
  let mines=new Set(),opened=new Set(),flagged=new Set(),phase='idle',t0=0,timer=null;
  const face=h('button',{class:'btn',style:'font-weight:700'},'Новая игра');
  const cnt=h('b',{}),clk=h('b',{}),grid=h('div',{class:'ms-g',style:'grid-template-columns:repeat('+N+',28px)'});
  const msg=h('div',{style:'font-size:12.5px;color:var(--txt-2);min-height:18px;text-align:center'},'Левый клик — открыть, правый — флажок.');
  win.body.append(h('div',{class:'ms'},
    h('div',{class:'ms-h'},h('span',{class:'row',style:'color:var(--danger)',html:ico('mine',17)}),cnt,face,
      h('span',{class:'row',style:'color:var(--txt-2)',html:ico('auto',16)}),clk),grid,msg));
  const nb=i=>{ const r=(i/N)|0,c=i%N,o=[];
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){ if(!dr&&!dc) continue; const nr=r+dr,nc=c+dc; if(nr>=0&&nc>=0&&nr<N&&nc<N) o.push(nr*N+nc); }
    return o; };
  const cnum=i=>nb(i).filter(j=>mines.has(j)).length;
  function reset(){
    mines=new Set(); opened=new Set(); flagged=new Set(); phase='idle';
    if(timer) clearInterval(timer); timer=null; clk.textContent='0';
    msg.textContent='Левый клик — открыть, правый — флажок.'; face.textContent='Новая игра'; draw();
  }
  function plant(first){ const safe=new Set([first].concat(nb(first))); while(mines.size<TOTAL){ const i=Math.floor(Math.random()*N*N); if(!safe.has(i)) mines.add(i); } }
  function reveal(i){ if(opened.has(i)||flagged.has(i)) return; opened.add(i); if(mines.has(i)){ phase='lost'; return; } if(cnum(i)===0) nb(i).forEach(reveal); }
  function hit(i){
    if(phase==='lost'||phase==='won') return;
    if(phase==='idle'){ plant(i); phase='play'; t0=Date.now(); timer=setInterval(()=>{ clk.textContent=String(Math.min(999,Math.floor((Date.now()-t0)/1000))); },500); }
    reveal(i);
    if(phase==='lost'){ clearInterval(timer); msg.textContent='Мина. Попробуйте ещё раз.'; face.textContent='Ещё раз'; blip(180,.22,.24,'sawtooth'); }
    else if(opened.size===N*N-TOTAL){ phase='won'; clearInterval(timer); msg.textContent='Поле очищено за '+clk.textContent+' с.'; face.textContent='Ещё раз'; blip(880,.16,.22); confetti(); }
    draw();
  }
  function flag(i){ if(phase==='lost'||phase==='won'||opened.has(i)) return; flagged.has(i)?flagged.delete(i):flagged.add(i); draw(); }
  function draw(){
    grid.innerHTML=''; cnt.textContent=String(TOTAL-flagged.size);
    for(let i=0;i<N*N;i++){
      const b=h('button',{class:'cell','aria-label':'Клетка '+(i+1)});
      if(opened.has(i)){
        b.classList.add('op');

function mountSnake(win){
  const N=20,S=16,PX=N*S;
  const cv=h('canvas',{width:PX,height:PX}),g=cv.getContext('2d');
  const score=h('b',{style:'font-variant-numeric:tabular-nums'},'0');
  const best=h('span',{style:'color:var(--txt-2);font-size:12px'},'рекорд: '+state.best);
  const bGo=h('button',{class:'btn pri'},'Старт');
  const msg=h('div',{style:'font-size:12.5px;color:var(--txt-2);text-align:center;min-height:18px'},'Стрелки или WASD. Съешьте яблоко, не врезайтесь в себя.');
  const pad=h('div',{class:'dpad'});
  win.body.append(h('div',{class:'sn'},
    h('div',{class:'ms-h'},h('span',{class:'row',style:'color:var(--acc)',html:ico('snake',17)}),score,bGo,best),
    cv,msg,pad));
  let snake,dir,next,food,timer=null,sc=0,speed=130;
  function seed(){ snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}]; dir={x:1,y:0}; next=dir; sc=0; speed=130; score.textContent='0'; drop(); draw(); }
  function drop(){ do{ food={x:(Math.random()*N)|0,y:(Math.random()*N)|0}; } while(snake.some(s=>s.x===food.x&&s.y===food.y)); }
  function step(){
    dir=next;
    const head={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};
    if(snake.some(s=>s.x===head.x&&s.y===head.y)){ over(); return; }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){
      sc+=10; score.textContent=String(sc); blip(880,.06,.14,'square'); drop();
      if(speed>60&&sc%50===0){ speed-=10; clearInterval(timer); timer=setInterval(step,speed); }
    } else snake.pop();
    draw();
  }
  function over(){
    clearInterval(timer); timer=null; bGo.textContent='Старт';
    msg.textContent='Игра окончена. Счёт: '+sc+'.';
    blip(160,.3,.2,'sawtooth');
    if(sc>state.best){ state.best=sc; best.textContent='рекорд: '+sc; save(); msg.textContent='Новый рекорд: '+sc+'!'; confetti(); }
  }
  function draw(){
    const cs=getComputedStyle(D.documentElement);
    g.fillStyle=cs.getPropertyValue('--surf-3')||'#222'; g.fillRect(0,0,PX,PX);
    g.fillStyle='rgba(255,255,255,.05)';
    for(let i=0;i<N;i+=2) for(let j=0;j<N;j+=2) g.fillRect(i*S,j*S,S,S);
    g.fillStyle=cs.getPropertyValue('--danger')||'#e33';
    g.beginPath(); g.arc(food.x*S+S/2,food.y*S+S/2,S/2-2,0,Math.PI*2); g.fill();
    const acc=cs.getPropertyValue('--acc')||'#0aa';
    snake.forEach((s,i)=>{ g.fillStyle=acc; g.globalAlpha=i?Math.max(.35,1-i/snake.length):1;
      g.fillRect(s.x*S+1,s.y*S+1,S-2,S-2); });
    g.globalAlpha=1;
  }
  function turn(x,y){ if(dir.x===-x&&dir.y===-y) return; next={x,y}; }
  bGo.onclick=()=>{
    if(timer){ clearInterval(timer); timer=null; bGo.textContent='Продолжить'; msg.textContent='Пауза.'; return; }
    if(!snake||!timer&&bGo.textContent==='Старт') seed();
    timer=setInterval(step,speed); bGo.textContent='Пауза'; msg.textContent='Поехали.';
  };
  [['up',0,-1],['left',-1,0],['right',1,0]].forEach(()=>{});
  pad.append(h('span'),h('button',{onclick:()=>turn(0,-1),html:ico('up',18)}),h('span'),
    h('button',{onclick:()=>turn(-1,0),html:ico('left',18)}),
    h('button',{onclick:()=>turn(0,1),html:ico('up',18)+''}),
    h('button',{onclick:()=>turn(1,0),html:ico('right',18)}));
  pad.children[4].style.rotate='180deg';
  win.node.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    const m={'arrowup':[0,-1],'w':[0,-1],'ц':[0,-1],'arrowdown':[0,1],'s':[0,1],'ы':[0,1],
             'arrowleft':[-1,0],'a':[-1,0],'ф':[-1,0],'arrowright':[1,0],'d':[1,0],'в':[1,0]};
    if(m[k]){ e.preventDefault(); turn(m[k][0],m[k][1]); }
    if(k===' '){ e.preventDefault(); bGo.click(); }
  });
  win.api.onClose=()=>{ if(timer) clearInterval(timer); };
  seed();
}

const TRACKS=[
  {name:'Загрузка системы',bpm:104,wave:'triangle',
   notes:[[0,1],[4,1],[7,1],[12,1],[11,1],[7,1],[4,1],[7,1],[2,1],[5,1],[9,1],[14,1],[12,1],[9,1],[5,1],[2,1]]},

   notes:[[0,1],[7,1],[12,1],[9,1],[5,1],[12,1],[7,1],[4,1],[9,1],[0,1],[7,1],[12,1],[5,1],[2,1],[9,1],[7,2]]},
  {name:'Синий экран, ля минор',bpm:88,wave:'sawtooth',
   notes:[[0,2],[3,1],[7,1],[10,2],[7,1],[3,1],[-2,2],[2,1],[5,1],[8,2],[5,1],[2,1]]}
];
function mountPlayer(win){
  const cv=h('canvas'),g=cv.getContext('2d');
  const info=h('div',{class:'pl-i'},h('b',{},'Ничего не играет'),h('span',{},'Выберите дорожку'));
  const bPlay=h('button',{class:'btn pri',html:ico('play',16)+'<span>Играть</span>'});
  const bNext=h('button',{class:'btn',html:ico('right',16)});
  const vol=h('input',{type:'range',class:'slider',min:'0',max:'100',value:'55','aria-label':'Громкость'});
  const list=h('div',{class:'pl-l'});
  win.body.append(h('div',{class:'pl'},h('div',{class:'pl-v'},cv,info),
    h('div',{class:'pl-c'},bPlay,bNext,h('span',{class:'row',style:'color:var(--txt-2)',html:ico('vol',16)}),vol,list)));
  let idx=0,playing=false,timer=null,step=0,master=null,an=null,raf=0;
  function ctx(){
    const c=actx(); if(!c) return null;
    if(!master){ master=c.createGain(); master.gain.value=vol.value/100*.5; an=c.createAnalyser(); an.fftSize=128; master.connect(an); an.connect(c.destination); }
    return c;
  }
  vol.oninput=()=>{ if(master) master.gain.value=vol.value/100*.5; };
  function note(c,semi,dur,wave){
    const o=c.createOscillator(),gn=c.createGain(),t=c.currentTime;
    o.type=wave; o.frequency.value=440*Math.pow(2,semi/12);
    o.connect(gn); gn.connect(master);
    gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(.22,t+.02);
    gn.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.start(t); o.stop(t+dur+.02);
    const b=c.createOscillator(),bg=c.createGain();
    b.type='sine'; b.frequency.value=440*Math.pow(2,(semi-24)/12);
    b.connect(bg); bg.connect(master);
    bg.gain.setValueAtTime(0,t); bg.gain.linearRampToValueAtTime(.16,t+.03);
    bg.gain.exponentialRampToValueAtTime(.001,t+dur*1.1);
    b.start(t); b.stop(t+dur*1.2);
  }
  function play(){
    const c=ctx(); if(!c){ toast('Аудио недоступно в этом браузере'); return; }
    playing=true; bPlay.innerHTML=ico('pause',16)+'<span>Пауза</span>';
    const tr=TRACKS[idx],beat=60/tr.bpm;
    info.querySelector('b').textContent=tr.name;
    info.querySelector('span').textContent='Фенестра · синтез в браузере · '+tr.bpm+' bpm';
    const run=()=>{
      const [semi,len]=tr.notes[step%tr.notes.length];
      note(c,semi,beat*len*.92,tr.wave);
      step++;
      timer=setTimeout(run,beat*len*1000);
    };
    run(); draw(); renderList();
  }
  function stop(){ playing=false; if(timer) clearTimeout(timer); timer=null; bPlay.innerHTML=ico('play',16)+'<span>Играть</span>'; renderList(); }
  bPlay.onclick=()=>playing?stop():play();
  bNext.onclick=()=>{ const was=playing; stop(); idx=(idx+1)%TRACKS.length; step=0; if(was) play(); else renderList(); };
  function renderList(){
    list.innerHTML='';
    TRACKS.forEach((t,i)=>list.append(h('button',{class:'track'+(i===idx?' on':''),onclick:()=>{ const was=playing; stop(); idx=i; step=0; was?play():renderList(); }},
      h('span',{class:'row',html:ico(i===idx&&playing?'pause':'play',14)}),t.name,h('small',{},t.bpm+' bpm'))));
  }
  function draw(){
    const r=cv.getBoundingClientRect();
    if(cv.width!==(r.width|0)||cv.height!==(r.height|0)){ cv.width=Math.max(1,r.width|0); cv.height=Math.max(1,r.height|0); }
    const w=cv.width,hh=cv.height;
    const cs=getComputedStyle(D.documentElement);
    g.clearRect(0,0,w,hh);
    const data=new Uint8Array(an?an.frequencyBinCount:32);
    if(an) an.getByteFrequencyData(data); else data.fill(0);
    const bars=data.length,bw=w/bars;
    for(let i=0;i<bars;i++){
      const v=playing?data[i]/255:0.06+0.05*Math.sin(Date.now()/600+i/2);
      const bh=Math.max(2,v*hh*.8);
      g.fillStyle='oklch('+(62+v*22)+'% '+(0.08+v*0.09)+' '+(cs.getPropertyValue('--acc-h')||190)+')';
      g.fillRect(i*bw+1,hh-bh,bw-2,bh);
    }
    raf=requestAnimationFrame(draw);
  }
  win.api.onClose=()=>{ stop(); cancelAnimationFrame(raf); };
  win.api.onResize=()=>{};
  renderList(); draw();
}

const SYSPROC=[['Оболочка Фенестры','win',9.2,148],['Диспетчер окон','win',4.1,96],['Служба времени','auto',0.4,18],['Индексатор файлов','folder',1.2,44]];
function mountTasks(win){
  const N=60;
  const cpuHist=Array(N).fill(0),ramHist=Array(N).fill(0);
  const cpuCv=h('canvas'),ramCv=h('canvas');
  const cpuVal=h('b',{},'0 %'),ramVal=h('b',{},'0,00 ГБ');
  const tipC=h('div',{class:'gt',hidden:''}),tipR=h('div',{class:'gt',hidden:''});
  const gCpu=h('div',{class:'graph'},h('div',{class:'gh'},h('span',{},'Процессор'),cpuVal),cpuCv,tipC);
  const gRam=h('div',{class:'graph'},h('div',{class:'gh'},h('span',{},'Память'),ramVal),ramCv,tipR);
  const graphs=h('div',{class:'graphs'},gCpu,gRam);
  const gauges=h('div',{class:'gauges'}),body=h('div',{class:'tsk'});
  const bKill=h('button',{class:'btn dng',html:ico('close',15)+'<span>Снять задачу</span>'});
  win.body.append(h('div',{class:'tool'},bKill,h('span',{style:'font-size:11.5px;color:var(--txt-2)'},'Обновление раз в секунду · наведите курсор на график')),
    graphs,gauges,body);
  let sel=null,timer=null,phase=0,hoverC=-1,hoverR=-1,first=true;
  const RAM_MAX=4096;
  const ru=v=>String(v).replace('.',',');
  const fmtCpu=v=>ru(v.toFixed(0))+' %', fmtRam=v=>ru((v/1024).toFixed(2))+' ГБ';
  const load=id=>{ const q=String(id).split('').reduce((a,c)=>a+c.charCodeAt(0),0); return 3+((q*7)%9)+Math.abs(Math.sin(phase/6+q))*4; };
  function css(v){ return getComputedStyle(D.documentElement).getPropertyValue(v).trim(); }
  function drawGraph(cv,data,max,hover,tip,fmt){
    const r=cv.getBoundingClientRect(); if(!r.width) return;
    const dpr=W.devicePixelRatio||1;
    cv.width=r.width*dpr; cv.height=r.height*dpr;
    const g=cv.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);
    const w=r.width,hh=r.height;
    g.clearRect(0,0,w,hh);
    g.strokeStyle=css('--line'); g.lineWidth=1;
    for(let i=1;i<4;i++){ const y=Math.round(hh*i/4)+.5; g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); }
    const pt=i=>[i*(w/(data.length-1)), hh-Math.min(1,data[i]/max)*(hh-6)-3];
    g.beginPath(); g.moveTo(0,hh);
    for(let i=0;i<data.length;i++){ const [x,y]=pt(i); g.lineTo(x,y); }
    g.lineTo(w,hh); g.closePath();
    g.fillStyle=css('--acc-soft')||'rgba(0,160,150,.15)'; g.fill();
    g.beginPath();
    for(let i=0;i<data.length;i++){ const [x,y]=pt(i); i?g.lineTo(x,y):g.moveTo(x,y); }
    g.strokeStyle=css('--acc'); g.lineWidth=2; g.lineJoin='round'; g.stroke();
    const [lxp,lyp]=pt(data.length-1);
    g.fillStyle=css('--acc'); g.beginPath(); g.arc(lxp-1,lyp,3,0,Math.PI*2); g.fill();
    g.fillStyle=css('--txt-2'); g.font='10px "DM Sans", system-ui, sans-serif';
    g.textAlign='right'; g.fillText(fmt(max),w-3,10);
    g.textAlign='left'; g.fillText('60 с назад',3,hh-3);
    if(hover>=0&&hover<data.length){
      const [hx,hy]=pt(hover);
      g.strokeStyle=css('--txt-2'); g.lineWidth=1; g.globalAlpha=.5;
      g.beginPath(); g.moveTo(hx,0); g.lineTo(hx,hh); g.stroke(); g.globalAlpha=1;
      g.fillStyle=css('--surf'); g.beginPath(); g.arc(hx,hy,4,0,Math.PI*2); g.fill();
      g.fillStyle=css('--acc'); g.beginPath(); g.arc(hx,hy,2.6,0,Math.PI*2); g.fill();
      tip.hidden=false;
      tip.textContent=fmt(data[hover])+' · '+(data.length-1-hover)+' с назад';
      const tw=tip.offsetWidth||90;
      tip.style.left=clamp(hx-tw/2,4,w-tw-4)+'px';
      tip.style.top=Math.max(2,hy-30)+'px';
    } else tip.hidden=true;
  }
  function bindHover(cv,setter,redraw){
    cv.addEventListener('pointermove',e=>{
      const r=cv.getBoundingClientRect();
      setter(clamp(Math.round((e.clientX-r.left)/(r.width/(N-1))),0,N-1));
      redraw();
    });
    cv.addEventListener('pointerleave',()=>{ setter(-1); redraw(); });
  }
  bindHover(cpuCv,v=>hoverC=v,()=>drawGraph(cpuCv,cpuHist,100,hoverC,tipC,fmtCpu));
  bindHover(ramCv,v=>hoverR=v,()=>drawGraph(ramCv,ramHist,RAM_MAX,hoverR,tipR,fmtRam));
  function render(){
    phase++;
    const rows=[...wins.values()].map(w=>({id:'w'+w.id,name:APPS[w.app].title,icon:APPS[w.app].icon,
        cpu:load(w.app+w.id),ram:120+APPS[w.app].title.length*13,win:w}))
      .concat(SYSPROC.map(([n,ic,c,r],i)=>({id:'s'+i,name:n,icon:ic,cpu:c+Math.abs(Math.sin(phase/8+i))*1.6,ram:r,win:null})));
    const cpu=Math.min(99,rows.reduce((a,r)=>a+r.cpu,0));
    const ram=rows.reduce((a,r)=>a+r.ram,0);
    if(first){ cpuHist.fill(cpu); ramHist.fill(ram); first=false; }
    cpuHist.push(cpu); cpuHist.shift(); ramHist.push(ram); ramHist.shift();
    cpuVal.textContent=ru(cpu.toFixed(1))+' %';
    ramVal.textContent=fmtRam(ram);
    drawGraph(cpuCv,cpuHist,100,hoverC,tipC,fmtCpu);
    drawGraph(ramCv,ramHist,RAM_MAX,hoverR,tipR,fmtRam);
    gauges.innerHTML='';
    const gauge=(lab,val,sub)=>h('div',{class:'gauge'},h('span',{},lab),h('b',{},val),h('div',{class:'meter'},h('i',{style:'width:'+clamp(sub,0,100)+'%'})));
    gauges.append(gauge('Окон',String(wins.size),Math.min(100,wins.size*12)),
      gauge('Рабочих столов',String(vds.length),vds.length*25),
      gauge('Файлов в корзине',String(bin.length),Math.min(100,bin.length*20)),
      gauge('Диск','0 МБ/с',3));
    const tb=h('table',{},h('thead',{},h('tr',{},h('th',{},'Имя'),h('th',{},'ЦП'),h('th',{},'Память'),h('th',{},'Тип'))));
    const tbody=h('tbody');
    rows.forEach(r=>{
      const tr=h('tr',{class:sel===r.id?'sel':''},
        h('td',{},h('div',{class:'nm'},h('span',{class:'row',style:'color:var(--acc)',html:ico(r.icon,16)}),r.name)),
        h('td',{},ru(r.cpu.toFixed(1))+' %'),h('td',{},r.ram+' МБ'),h('td',{},r.win?'Приложение':'Система'));
      tr.onclick=()=>{ sel=r.id; render(); };
      tbody.append(tr);
    });
    tb.append(tbody);
    body.innerHTML=''; body.append(tb);
    const cur=rows.find(r=>r.id===sel);
    bKill.disabled=!cur||!cur.win;
    bKill.onclick=()=>{ if(cur&&cur.win){ closeWin(cur.win); sel=null; render(); toast('Задача снята: '+cur.name); } };
  }
  timer=setInterval(render,1000);
  win.api.onResize=render;
  win.api.onClose=()=>clearInterval(timer);
  render(); setTimeout(render,60);
}

const fxEl=$('#fx'),fxCv=fxEl.querySelector('canvas'),fxG=fxCv.getContext('2d');
let fxRaf=0,fxStop=0;
function fxSize(){ fxCv.width=W.innerWidth; fxCv.height=W.innerHeight; }
function fxEnd(){ cancelAnimationFrame(fxRaf); fxEl.hidden=true; fxG.clearRect(0,0,fxCv.width,fxCv.height); }
function confetti(){
  fxSize(); fxEl.hidden=false;
  const hue=+getComputedStyle(D.documentElement).getPropertyValue('--acc-h')||190;
  const P=Array.from({length:130},()=>({x:rnd(0,fxCv.width),y:rnd(-fxCv.height,0),w:rnd(5,11),hh:rnd(7,15),
    vy:rnd(1.8,4.6),vx:rnd(-1,1),rot:rnd(0,6),vr:rnd(-.2,.2),c:'oklch('+rnd(55,78)+'% .16 '+((hue+rnd(-70,70))%360)+')'}));
  const t0=Date.now();
  (function loop(){
    fxG.clearRect(0,0,fxCv.width,fxCv.height);
    P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      fxG.save(); fxG.translate(p.x,p.y); fxG.rotate(p.rot); fxG.fillStyle=p.c; fxG.fillRect(-p.w/2,-p.hh/2,p.w,p.hh); fxG.restore(); });
    if(Date.now()-t0<3000) fxRaf=requestAnimationFrame(loop); else fxEnd();
  })();
}
function matrixRain(){
  fxSize(); fxEl.hidden=false;
  const glyphs='01АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';
  const cols=Math.floor(fxCv.width/16),drops=Array(cols).fill(0).map(()=>rnd(-40,0));
  const t0=Date.now();
  fxG.fillStyle='#000'; fxG.fillRect(0,0,fxCv.width,fxCv.height);
  (function loop(){
    fxG.fillStyle='rgba(0,0,0,.09)'; fxG.fillRect(0,0,fxCv.width,fxCv.height);
    fxG.font='15px "JetBrains Mono", monospace';
    drops.forEach((y,i)=>{
      const ch=glyphs[(Math.random()*glyphs.length)|0];
      fxG.fillStyle='oklch(88% .2 150)'; fxG.fillText(ch,i*16,y*16);
      fxG.fillStyle='oklch(62% .19 150)'; fxG.fillText(glyphs[(Math.random()*glyphs.length)|0],i*16,(y-1)*16);
      drops[i]=y*16>fxCv.height&&Math.random()>.975?0:y+1;
    });
    if(Date.now()-t0<9000&&!fxStop) fxRaf=requestAnimationFrame(loop); else { fxStop=0; fxEnd(); }
  })();
}
fxEl.addEventListener('pointerdown',()=>{ fxStop=1; });

/* ---------------- заставка ---------------- */
const saverEl=$('#saver'),saverCv=saverEl.querySelector('canvas'),sg=saverCv.getContext('2d');
let idleT=null,saverRaf=0,sx=60,sy=60,svx=2.2,svy=1.7,shue=0;
function saverOn(){
  if(!saverEl.hidden||!$('#setup').hidden||!$('#boot').hidden||!$('#bsod').hidden||!$('#recovery').hidden||$('#os').hidden) return;
  saverEl.hidden=false;
  const fit=()=>{ saverCv.width=W.innerWidth; saverCv.height=W.innerHeight; };
  fit();
  (function loop(){
    const w=saverCv.width,hh=saverCv.height,bw=248,bh=96;
    sg.fillStyle='rgba(0,0,0,.28)'; sg.fillRect(0,0,w,hh);
    sx+=svx; sy+=svy;
    let corner=0;
    if(sx<=0||sx+bw>=w){ svx*=-1; sx=clamp(sx,0,w-bw); shue=(shue+70)%360; corner++; }
    if(sy<=0||sy+bh>=hh){ svy*=-1; sy=clamp(sy,0,hh-bh); shue=(shue+70)%360; corner++; }
    if(corner===2){ state.corners++; save(); }
    sg.fillStyle='oklch(62% .16 '+shue+')';
    sg.beginPath(); sg.roundRect(sx,sy,bw,bh,16); sg.fill();
    sg.fillStyle='#fff'; sg.font='700 30px "DM Sans", system-ui, sans-serif';
    sg.fillText('Фенестра 9',sx+22,sy+52);
    sg.font='13px "DM Sans", system-ui, sans-serif'; sg.globalAlpha=.85;
    sg.fillText('углов задето: '+state.corners,sx+22,sy+74);
    sg.globalAlpha=1;
    saverRaf=requestAnimationFrame(loop);
  })();
}
function saverOff(){ if(saverEl.hidden) return; saverEl.hidden=true; cancelAnimationFrame(saverRaf); sg.clearRect(0,0,saverCv.width,saverCv.height); }
function idleReset(){ saverOff(); clearTimeout(idleT); idleT=setTimeout(saverOn,90000); }
['pointerdown','pointermove','keydown','wheel','touchstart'].forEach(ev=>D.addEventListener(ev,idleReset,{passive:true}));

function bsod(code){
  closePops(); saverOff();
  const el=$('#bsod'); el.hidden=false; el.innerHTML='';
  let pct=0;
  const p=h('p',{},'Собираем сведения об ошибке. Система перезагрузится автоматически: ',h('b',{},'0 %'));
  el.append(h('div',{class:'sad'},':('),
    h('h1',{},'На этом устройстве возникла проблема, и его нужно перезагрузить'),
    p,
    h('div',{class:'row',style:'gap:18px;align-items:flex-start;margin-top:8px'},
      h('div',{class:'qr'}),
      h('div',{},h('p',{style:'margin:0 0 8px'},'Код остановки: ',h('code',{},code||'FENESTRA_UNEXPECTED_STORE_EXCEPTION')),
        h('p',{style:'margin:0;opacity:.85'},'R — среда восстановления · Esc — перезагрузить сейчас'))));
  blip(120,.6,.25,'sawtooth');
  const t=setInterval(()=>{
    pct+=Math.random()*9+3;
    p.querySelector('b').textContent=Math.min(100,Math.round(pct))+' %';
    if(pct>=100){ clearInterval(t); el.onkeydown=null; el.hidden=true; reboot(); }
  },320);
  const kh=e=>{
    const k=e.key.toLowerCase();
    if(k==='r'||k==='к'){ clearInterval(t); D.removeEventListener('keydown',kh); el.hidden=true; openRecovery(); }
    else if(e.key==='Escape'){ clearInterval(t); D.removeEventListener('keydown',kh); el.hidden=true; reboot(); }
  };
  D.addEventListener('keydown',kh);
}

function openRecovery(){
  closePops(); saverOff();
  [...wins.values()].forEach(w=>{ w.node.remove(); w.taskBtn.remove(); if(w.watcher) fsWatchers.delete(w.watcher); if(w.api.onClose) try{w.api.onClose();}catch(e){} });
  wins.clear(); active=null;
  $('#os').hidden=true;
  const el=$('#recovery'); el.hidden=false; el.innerHTML='';
  const out=h('div',{class:'rec-o'});
  const inp=h('input',{spellcheck:'false',autocomplete:'off',placeholder:'help, restore, reset, fsck, key, boot'});
  const log=(t,c)=>{ out.append(h('div',{style:c||''},t)); out.scrollTop=out.scrollHeight; };
  const items=[
    ['boot','Продолжить','Выйти и загрузить Фенестру 9',()=>{ el.hidden=true; reboot(); }],
    ['refresh','Восстановление файлов','Вернуть исходные папки и документы, настройки сохранить',()=>{
      fs=defaultFs(); seedImage(); bin=[]; save(); log('Файловая система восстановлена из образа.','color:oklch(85% .15 150)'); }],
    ['wrench','Сброс параметров','Тема, акцент, обои и звук — к значениям по умолчанию',()=>{
      state.theme='system'; state.accent='teal'; state.wall='dusk'; state.vol=0; save();
      log('Параметры оформления сброшены.','color:oklch(85% .15 150)'); }],
    ['disk','Проверка диска','Просмотр целостности файловой системы',()=>fsck()],
    ['key','Ключ продукта','Показать и проверить ключ',()=>{
      log('Ключ: '+(state.key||'не введён'));
      log('Состояние: '+(state.activated?'активировано':'не активировано'),state.activated?'color:oklch(85% .15 150)':'color:oklch(80% .16 60)'); }],
    ['power','Полный сброс','Стереть всё и запустить установщик заново',()=>{
      if(confirm('Стереть файлы, настройки и ключ?')){ el.hidden=true; factoryReset(); } }]
  ];
  const grid=h('div',{class:'rec-g'});
  items.forEach(([icn,t,d,fn])=>grid.append(h('button',{class:'rec-i',onclick:fn},
    h('span',{class:'row',html:ico(icn,20)}),h('span',{},h('b',{},t),h('span',{},d)))));
  el.append(h('div',{class:'rec-w'},
    h('div',{class:'rec-h'},h('b',{},'Среда восстановления Фенестры'),
      h('span',{},'Система не загружена. Выберите действие или используйте консоль ниже.')),
    grid,out,
    h('div',{class:'rec-in'},h('span',{},'recovery>'),inp)));
  function fsck(){
    log('Проверка тома «'+state.disk+'»…');
    const steps=['Этап 1: проверка базовой структуры файлов','Этап 2: проверка индексов','Этап 3: дескрипторы безопасности','Этап 4: проверка свободного пространства'];
    steps.forEach((s,i)=>setTimeout(()=>log('  '+s+' … ок','opacity:.85'),300*(i+1)));
    setTimeout(()=>{
      let files=0,dirs=0;
      (function walk(n){ for(const k in n.c){ const ch=n.c[k]; if(ch.t==='d'){ dirs++; walk(ch); } else files++; } })(fs);
      log('Найдено: папок '+dirs+', файлов '+files+', в корзине '+bin.length+'. Ошибок не обнаружено.','color:oklch(85% .15 150)');
    },1400);
  }
  inp.onkeydown=e=>{
    if(e.key!=='Enter') return;
    const v=inp.value.trim().toLowerCase(); inp.value='';
    log('recovery> '+v,'color:oklch(78% .13 220)');
    if(!v) return;
    if(v==='help') ['boot — загрузить систему','restore — восстановить файлы','reset — сбросить параметры','fsck — проверить диск','key — показать ключ','wipe — полный сброс','clear — очистить вывод'].forEach(s=>log('  '+s,'opacity:.8'));
    else if(v==='boot'){ el.hidden=true; reboot(); }
    else if(v==='restore') items[1][3]();
    else if(v==='reset') items[2][3]();
    else if(v==='fsck') fsck();
    else if(v==='key') items[4][3]();
    else if(v==='wipe'){ el.hidden=true; factoryReset(); }
    else if(v==='clear') out.innerHTML='';
    else log('Неизвестная команда: '+v+'. Наберите help.','color:oklch(78% .16 25)');
  };
  log('Фенестра RE 1.0 · '+new Date().toLocaleString('ru-RU'));
  log('Том: '+state.disk+' · файлов в корзине: '+bin.length,'opacity:.8');
  setTimeout(()=>{ if(!('ontouchstart' in W)) inp.focus(); },60);
}

function runSetup(){
  const el=$('#setup'); el.hidden=false; el.innerHTML='';
  const card=h('div',{class:'su'});
  el.append(card);
  const STEPS=['Язык','Лицензия','Ключ','Диск','Установка','Пользователь','Готово'];
  let step=0,agreed=false,key='',disk=0,user='Гость',sounds=false,suggested=genKey();
  const crumbs=()=>h('div',{class:'steps'},STEPS.map((s,i)=>h('b',{class:i===step?'on':''},(i?' · ':'')+s)));
  const nav=(back,next,nextLabel,extra)=>h('div',{class:'nav'},
    back?h('button',{class:'btn-l',onclick:back},'Назад'):null,
    h('div',{class:'grow'}),extra||null,
    h('button',{class:'btn-p',onclick:next,disabled:!next},nextLabel||'Далее'));
  function draw(){
    card.innerHTML='';
    card.append(crumbs());

      card.append(h('div',{class:'row',style:'gap:14px'},h('div',{style:'color:oklch(82% .13 var(--acc-h))',html:LOGO}),
          h('div',{},h('h1',{},'Установка Фенестры 9'),h('p',{},'Оболочка на одной HTML-странице. Установка займёт меньше минуты и ничего не скачает.'))),
        h('div',{class:'lic'},h('h4',{},'Язык и раскладка'),
          h('p',{style:'margin:0'},'Русский (Россия) · клавиатура: русская · часовой пояс: как в браузере')),
        nav(null,()=>{ step=1; draw(); },'Далее',
          h('button',{class:'skip',onclick:()=>{ key=suggested; finish(false); }},'Пропустить установку')));
    } else if(step===1){
      const ch=h('input',{type:'checkbox'}); ch.checked=agreed;
      const btn=h('button',{class:'btn-p',onclick:()=>{ step=2; draw(); },disabled:!agreed},'Принять и продолжить');
      ch.onchange=()=>{ agreed=ch.checked; btn.disabled=!agreed; };
      card.append(h('h1',{},'Лицензионное соглашение'),
        h('div',{class:'lic'},LICENSE.map((t,i)=>h('p',{style:'margin:0 0 8px'},(i+1)+'. '+t))),
        h('label',{class:'ch'},ch,h('span',{},'Я прочитал и принимаю условия. Особенно пункт про Сапёр.')),

function seedImage(){
  try{
    const c=D.createElement('canvas'); c.width=520; c.height=330;
    const g=c.getContext('2d');
    const grd=g.createLinearGradient(0,0,520,330);
    grd.addColorStop(0,'#0d3d45'); grd.addColorStop(.55,'#12525a'); grd.addColorStop(1,'#1d2b4a');
    g.fillStyle=grd; g.fillRect(0,0,520,330);
    g.lineWidth=1.4;
    for(let k=0;k<26;k++){
      g.strokeStyle='rgba(180,240,235,'+(0.07+k*0.012).toFixed(3)+')';
      g.beginPath();
      for(let x=0;x<=520;x+=6){ const y=170+Math.sin((x/74)+k/2.6)*(26+k*1.6)+k*3.4; x===0?g.moveTo(x,y):g.lineTo(x,y); }
      g.stroke();
    }
    g.fillStyle='rgba(255,255,255,.9)'; g.beginPath(); g.arc(412,74,17,0,Math.PI*2); g.fill();
    const dir=node(['Изображения']);
    if(dir&&!dir.c['волны.png']) dir.c['волны.png']={t:'f',data:c.toDataURL('image/png')};
  }catch(e){}
}

D.addEventListener('keydown',e=>{
  if(!$('#os').hidden&&!$('#lock').hidden&&(e.key==='Enter'||e.key==='Escape')){ $('#lock').hidden=true; return; }
  if(!$('#setup').hidden||!$('#boot').hidden||!$('#bsod').hidden||!$('#recovery').hidden) return;
  if(e.key==='Escape'){
    closePops(); fxStop=1; hidePrev();
    if(!$('#run').hidden){ $('#run').hidden=true; $('#run').innerHTML=''; }
    if(!$('#taskviewL').hidden) toggleTaskView();
    return;
  }
  if(e.ctrlKey&&e.altKey&&(e.key==='Delete'||e.key==='Del')){ e.preventDefault(); openWin('tasksmgr'); return; }
  if((e.key==='r'||e.key==='к')&&(e.metaKey||(e.ctrlKey&&e.altKey))){ e.preventDefault(); runDialog(); return; }
  if(e.key==='Meta'||e.key==='OS'){ e.preventDefault(); toggleStart(); return; }
  if(e.key==='F5'&&!e.target.closest('input,textarea')){ e.preventDefault(); renderIcons(); toast('Рабочий стол обновлён'); return; }
  if(e.key==='Tab'&&e.altKey){
    e.preventDefault();
    const open=[...wins.values()].filter(w=>!w.min);
    if(open.length<2) return;
    open.sort((a,b)=>+a.node.style.zIndex-+b.node.style.zIndex);
    focus(open[e.shiftKey?open.length-2:0]);
  }
});

/* ================= живые обои ================= */
const wallCv=$('#wallcv'),wallG=wallCv.getContext('2d');
let wallRaf=0,wallLast=0,wallMode='',stars=[],comet=null;
function wallFit(){ const r=deskEl.getBoundingClientRect(); wallCv.width=Math.max(1,r.width|0); wallCv.height=Math.max(1,r.height|0); }
function wallStop(){ if(wallRaf) cancelAnimationFrame(wallRaf); wallRaf=0; wallG.clearRect(0,0,wallCv.width,wallCv.height); }
function wallpaper(mode){
  const live=mode==='space'||mode==='flow';
  wallMode=mode; wallCv.hidden=!live;
  if(!live){ wallStop(); return; }
  wallFit();
  if(mode==='space'&&!stars.length)
    stars=Array.from({length:240},()=>({x:Math.random(),y:Math.random(),z:rnd(.22,1),s:rnd(.5,1.9),t:rnd(0,7)}));
  if(wallRaf) return;
  const loop=t=>{
    wallRaf=requestAnimationFrame(loop);
    if(t-wallLast<32) return;
    wallLast=t;
    if(D.hidden||!saverEl.hidden||$('#os').hidden) return;
    const w=wallCv.width,hh=wallCv.height;
    const hue=parseFloat(getComputedStyle(D.documentElement).getPropertyValue('--acc-h'))||190;
    wallG.clearRect(0,0,w,hh);
    if(wallMode==='space'){
      stars.forEach(st=>{
        st.x+=0.00022*st.z; if(st.x>1.02) st.x=-0.02;
        const tw=0.55+0.45*Math.sin(t/700+st.t);
        wallG.globalAlpha=(0.25+0.6*st.z)*tw;
        wallG.fillStyle=st.z>.8?'oklch(92% .07 '+hue+')':'#fff';
        wallG.fillRect(st.x*w,st.y*hh,st.s*st.z*1.6,st.s*st.z*1.6);
      });
      wallG.globalAlpha=1;
      if(!comet&&Math.random()<0.006) comet={x:rnd(0,w*.7),y:rnd(0,hh*.4),v:rnd(7,11),l:0};
      if(comet){
        comet.x+=comet.v; comet.y+=comet.v*.42; comet.l+=1;
        const g2=wallG.createLinearGradient(comet.x,comet.y,comet.x-90,comet.y-38);
        g2.addColorStop(0,'oklch(95% .12 '+hue+')'); g2.addColorStop(1,'transparent');
        wallG.strokeStyle=g2; wallG.lineWidth=2; wallG.lineCap='round';
        wallG.beginPath(); wallG.moveTo(comet.x,comet.y); wallG.lineTo(comet.x-90,comet.y-38); wallG.stroke();
        if(comet.x>w+120||comet.l>240) comet=null;
      }
    } else {
      const bands=7;
      for(let i=0;i<bands;i++){
        const ph=t/2600+i*.55, amp=hh*(0.05+i*0.012), base=hh*(0.22+i*0.1);
        wallG.beginPath();
        for(let x=0;x<=w;x+=14){
          const y=base+Math.sin(x/(190+i*26)+ph)*amp+Math.sin(x/97-ph*1.6)*amp*.34;
          x===0?wallG.moveTo(x,y):wallG.lineTo(x,y);
        }
        wallG.lineTo(w,hh); wallG.lineTo(0,hh); wallG.closePath();
        wallG.fillStyle='oklch('+(34+i*4.5)+'% .09 '+((hue+i*11)%360)+' / .3)';
        wallG.fill();
      }
    }
  };
  wallRaf=requestAnimationFrame(loop);
}

/* ================= рабочие столы ================= */
let vds=['Рабочий стол 1','Рабочий стол 2'], curVD=0;
function renderVDBar(){
  const bar=$('#vdbar'); bar.innerHTML='';
  bar.hidden=isNarrow()||vds.length<2;
  vds.forEach((nm,i)=>bar.append(h('button',{class:'vdot'+(i===curVD?' on':''),title:nm,onclick:()=>switchVD(i)},String(i+1))));
}
function switchVD(i){
  if(i===curVD||!vds[i]) return;
  curVD=i; active=null;
  wins.forEach(w=>{ w.node.hidden=w.vd!==i||w.min; w.node.classList.remove('act'); });
  focusTop(); renderVDBar(); renderTaskView();
  toast(vds[i]);
}
function moveWin(w,i){
  if(!vds[i]) return;
  w.vd=i; w.node.hidden=i!==curVD||w.min;
  syncTasks(); focusTop(); renderTaskView();
  toast(APPS[w.app].title+' → '+vds[i]);
}
function addVD(){
  if(vds.length>=4){ toast('Больше четырёх столов не помещается'); return; }
  vds.push('Рабочий стол '+(vds.length+1)); renderVDBar(); renderTaskView();
}
function removeVD(i){
  if(vds.length<2) return;
  wins.forEach(w=>{ if(w.vd===i) w.vd=0; else if(w.vd>i) w.vd--; });
  vds.splice(i,1);
  vds=vds.map((_,k)=>'Рабочий стол '+(k+1));
  curVD=Math.min(curVD,vds.length-1);
  switchVD(curVD); wins.forEach(w=>{ w.node.hidden=w.vd!==curVD||w.min; });
  syncTasks(); focusTop(); renderVDBar(); renderTaskView();
}
function renderTaskView(){
  const L=$('#taskviewL'); if(L.hidden) return;
  L.innerHTML='';
  const g=h('div',{class:'tv-g'});
  vds.forEach((nm,i)=>{
    const ul=h('ul');
    [...wins.values()].filter(w=>w.vd===i).forEach(w=>ul.append(h('li',{},
      h('span',{class:'row',html:ico(APPS[w.app].icon,14)}),w.titleEl.textContent)));
    if(!ul.children.length) ul.append(h('li',{style:'opacity:.5'},'пусто'));
    const card=h('button',{class:'tv-d'+(i===curVD?' on':''),onclick:()=>{ switchVD(i); toggleTaskView(); }},h('b',{},nm),ul);
    if(vds.length>1) card.append(h('span',{class:'rm',title:'Закрыть стол',html:ico('close',14),
      onclick:e=>{ e.stopPropagation(); removeVD(i); }}));
    g.append(card);
  });
  g.append(h('button',{class:'tv-add',title:'Новый рабочий стол',html:ico('plus',22),onclick:addVD}));
  L.append(h('div',{class:'tv-h'},'Рабочие столы · Esc или повторный клик закроет представление'),g,
    h('div',{class:'tv-h'},'Окон открыто: '+wins.size));
}
function toggleTaskView(){
  const L=$('#taskviewL');

}

function runDialog(){
  closePops();
  const el=$('#run'); el.hidden=false; el.innerHTML='';
  const inp=h('input',{placeholder:'notepad, term, fenestra://about, Документы/борщ.txt',spellcheck:'false','aria-label':'Команда'});
  const hint=h('p',{},'Введите имя приложения, адрес или путь к файлу. Список приложений — команда apps в терминале.');
  const close=()=>{ el.hidden=true; el.innerHTML=''; };
  function go(){
    const v=inp.value.trim(); if(!v){ close(); return; }
    const low=v.toLowerCase();
    if(RUN_MAP[low]){ close(); openWin(RUN_MAP[low]); return; }
    if(low==='winver'){ close(); toast('Фенестра '+state.ver+', сборка '+BUILD[state.ver]+'. Лицензия: '+(state.activated?'активна':'не активна')); return; }

    if(low==='crash'){ close(); bsod('FENESTRA_MANUALLY_INITIATED_CRASH'); return; }
    if(low==='recovery'){ close(); openRecovery(); return; }
    if(low.startsWith('fenestra://')||low.startsWith('file:')){ close(); openWin('browser',{url:v}); return; }
    const path=v.replace(/^[~/]+/,'').split('/').filter(Boolean);
    if(node(path)){ close(); openFile(path); return; }
    hint.textContent='Не найдено: «'+v+'». Проверьте имя приложения или путь.';
    inp.style.borderColor='var(--danger)';
  }
  inp.oninput=()=>{ inp.style.borderColor=''; };
  inp.onkeydown=e=>{ if(e.key==='Enter') go(); if(e.key==='Escape') close(); };
  el.append(h('div',{class:'run-c'},
    h('h3',{},h('span',{class:'row',style:'color:var(--acc)',html:ico('term',18)}),'Выполнить'),hint,inp,

      h('button',{class:'btn',onclick:close},'Отмена'),
      h('button',{class:'btn pri',onclick:go},'Открыть'))));
  el.addEventListener('click',e=>{ if(e.target.id==='run') close(); });
  setTimeout(()=>inp.focus(),30);
}
